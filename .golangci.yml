version: "2"

linters:
  enable:
    - depguard
    - gosec
  settings:
    depguard:
      rules:
        domain-stdlib-only:
          files:
            - "**/internal/domain/**"
            - "!$test"
          allow:
            - "$gostd"
        service-no-adapters:
          files:
            - "**/internal/service/**"
            - "!$test"
          deny:
            - pkg: github.com/benkivuva/storefront-backend/internal/adapter
              desc: service depends on domain ports, never adapters
  exclusions:
    rules:
      # Gosec targets production code. Tests use weak rand for determinism,
      # variable URLs for httptest, and construct cookies without flags.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
