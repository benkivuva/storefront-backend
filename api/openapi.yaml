openapi: 3.1.0
info:
  title: Storefront Backend API
  version: 1.0.0
  description: The REST API for the Storefront.
servers:
  - url: http://localhost:8080
    description: Local Development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
    
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [customer, admin] }
        phone: { type: string }
        is_email_verified: { type: boolean }
        created_at: { type: string, format: date-time }

    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        recipient: { type: string }
        phone: { type: string }
        line1: { type: string }
        line2: { type: string }
        town: { type: string }
        county: { type: string }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        description: { type: string }
        category_id: { type: string, format: uuid }
        price_minor: { type: integer }
        currency: { type: string, example: KES }
        tax_class: { type: string, enum: [STANDARD_16, ZERO_RATED, EXEMPT] }
        version: { type: integer }

    CartItem:
      type: object
      properties:
        product_id: { type: string, format: uuid }
        quantity: { type: integer }
        unit_price_minor: { type: integer }

    Cart:
      type: object
      properties:
        id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING_PAYMENT, PAID, FULFILLING, SHIPPED, DELIVERED, CANCELLED] }
        total_minor: { type: integer }
        currency: { type: string }
        created_at: { type: string, format: date-time }

paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses:
        '201': { description: User created }
        '409': { description: Email taken }

  /api/v1/auth/login:
    post:
      summary: Authenticate a user
      responses:
        '200': { description: Login successful }
        '401': { description: Invalid credentials }

  /api/v1/me:
    get:
      summary: Get current user profile
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Profile retrieved }

  /api/v1/me/addresses:
    get:
      summary: List user addresses
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Addresses retrieved }
    post:
      summary: Create a new address
      security: [{ BearerAuth: [] }]
      responses:
        '201': { description: Address created }

  /api/v1/cart:
    get:
      summary: Get active cart
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Cart retrieved }

  /api/v1/cart/items:
    post:
      summary: Add item to cart
      security: [{ BearerAuth: [] }]
      responses:
        '204': { description: Item added }

  /api/v1/checkout:
    post:
      summary: Checkout cart
      description: Requires Idempotency-Key header.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '201': { description: Order created }
        '409': { description: Price changed or out of stock }

  /api/v1/orders:
    get:
      summary: List user orders
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Orders retrieved }

  /api/v1/admin/products:
    post:
      summary: Create a product (Admin only)
      security: [{ BearerAuth: [] }]
      responses:
        '201': { description: Product created }
        '403': { description: Forbidden }

  /api/v1/admin/products/{id}:
    put:
      summary: Update a product (Admin only)
      description: Requires If-Match header for optimistic concurrency.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
      responses:
        '200': { description: Product updated }
        '412': { description: Precondition Failed (version mismatch) }
