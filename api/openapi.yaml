openapi: 3.1.0
info:
  title: Storefront Backend API
  version: 1.0.0
  description: The REST API for the Storefront.
servers:
  - url: http://localhost:8080
    description: Local Development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
    
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [customer, admin] }
        phone: { type: string }
        is_email_verified: { type: boolean }
        created_at: { type: string, format: date-time }

    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        recipient: { type: string }
        phone: { type: string }
        line1: { type: string }
        line2: { type: string }
        town: { type: string }
        county: { type: string }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        description: { type: string }
        category_id: { type: string, format: uuid }
        price_minor: { type: integer }
        currency: { type: string, example: KES }
        tax_class: { type: string, enum: [STANDARD_16, ZERO_RATED, EXEMPT] }
        etims_item_code: { type: string }
        version: { type: integer }

    CartItem:
      type: object
      properties:
        product_id: { type: string, format: uuid }
        quantity: { type: integer }
        unit_price_minor: { type: integer }

    Cart:
      type: object
      properties:
        id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_number: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING_PAYMENT, PAID, FULFILLING, SHIPPED, DELIVERED, CANCELLED] }
        subtotal_minor: { type: integer }
        tax_minor: { type: integer }
        delivery_fee_minor: { type: integer }
        total_minor: { type: integer }
        currency: { type: string }
        payment_expires_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              sku: { type: string }
              product_name: { type: string }
              quantity: { type: integer }
              unit_price_minor: { type: integer }
              tax_class: { type: string, enum: [STANDARD_16, ZERO_RATED, EXEMPT] }
              tax_rate_bp: { type: integer }
              line_vat_minor: { type: integer }
              line_gross_minor: { type: integer }
        created_at: { type: string, format: date-time }

    Payment:
      type: object
      properties:
        payment_id: { type: string, format: uuid, description: Our internal payment UUID. }
        provider_reference: { type: string, description: Reference the payment provider uses for callbacks. }
        provider: { type: string, example: mock }
        order_id: { type: string, format: uuid }
        method: { type: string, enum: [card, mpesa, airtel_money] }
        status: { type: string, enum: [INITIATED, PENDING, SUCCEEDED, FAILED, EXPIRED, ORPHANED] }
        amount_minor: { type: integer }
        currency: { type: string }
        failure_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses:
        '201': { description: User created }
        '409': { description: Email taken }

  /api/v1/auth/login:
    post:
      summary: Authenticate a user
      responses:
        '200': { description: Login successful }
        '401': { description: Invalid credentials }

  /api/v1/me:
    get:
      summary: Get current user profile
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Profile retrieved }

  /api/v1/me/addresses:
    get:
      summary: List user addresses
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Addresses retrieved }
    post:
      summary: Create a new address
      security: [{ BearerAuth: [] }]
      responses:
        '201': { description: Address created }

  /api/v1/cart:
    get:
      summary: Get active cart
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Cart retrieved }

  /api/v1/cart/items:
    post:
      summary: Add item to cart
      security: [{ BearerAuth: [] }]
      responses:
        '204': { description: Item added }

  /api/v1/checkout:
    post:
      summary: Checkout cart
      description: Requires Idempotency-Key header.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '201': { description: Order created }
        '409': { description: Price changed or out of stock }

  /api/v1/orders:
    get:
      summary: List user orders
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200': { description: Orders retrieved }

  /api/v1/orders/{id}:
    get:
      summary: Get one of the caller's orders
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { description: Order not found }

  /api/v1/products:
    get:
      summary: List products
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          description: RFC 3339 created_at for sort=newest; integer offset for other sorts.
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string, format: uuid }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: in_stock
          schema: { type: boolean }
        - in: query
          name: min_price
          schema: { type: integer }
        - in: query
          name: max_price
          schema: { type: integer }
        - in: query
          name: sort
          schema: { type: string, enum: [newest, price_asc, price_desc, name_asc], default: newest }
      responses:
        '200': { description: Products retrieved }
        '400': { description: Invalid cursor or sort }

  /api/v1/admin/products:
    post:
      summary: Create a product (Admin only)
      security: [{ BearerAuth: [] }]
      responses:
        '201': { description: Product created }
        '403': { description: Forbidden }

  /api/v1/admin/products/{id}/inventory:
    post:
      summary: Adjust product stock (Admin only)
      description: Requires If-Match. Positive deltas restock, negative deltas are rejected below zero.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta, reason]
              properties:
                delta: { type: integer }
                reason: { type: string, enum: [RESTOCK, ADJUSTMENT, DAMAGE, RETURN] }
      responses:
        '204': { description: Stock adjusted }
        '409': { description: Insufficient stock or stale version }

  /api/v1/admin/products/low-stock:
    get:
      summary: List products at or below their stock threshold (Admin only)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200': { description: Low-stock products }
        '403': { description: Forbidden }

  /api/v1/admin/products/{id}:
    put:
      summary: Update a product (Admin only)
      description: Requires If-Match header for optimistic concurrency.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
      responses:
        '200': { description: Product updated }
        '400': { description: Missing or malformed If-Match }
        '409': { description: Conflict (stale version) }

  /api/v1/orders/{id}/payments:
    post:
      summary: Initiate a payment
      description: Requires Idempotency-Key. Returns our payment_id and the provider reference.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '202': { description: Payment initiated }
        '409': { description: Order is not payable or expired }

  /api/v1/orders/{id}/payments/status:
    get:
      summary: Poll the latest payment for an order
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Latest payment }
        '404': { description: Order or payment not found }

  /api/v1/orders/{id}/cancel:
    post:
      summary: Cancel an order awaiting payment
      description: Only PENDING_PAYMENT orders can be cancelled. Releases reserved stock atomically.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Order cancelled }
        '409': { description: Order is not cancellable }

  /api/v1/admin/payments/orphaned:
    get:
      summary: List orphaned payments awaiting reconciliation (Admin only)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Orphaned payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
        '403': { description: Forbidden }

  /api/v1/webhooks/{provider}:
    post:
      summary: Provider payment callback
      description: |
        Unauthenticated but signature-verified by the configured provider
        adapter. Deduplicated by provider event id. A success for an order that
        was already cancelled or expired marks the payment ORPHANED and emits a
        PaymentOrphaned event instead of silently dropping it.
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, example: mock }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, reference, status, amount_minor, currency]
              properties:
                event_id: { type: string }
                reference: { type: string, description: Our provider_reference (or payment_id). }
                status: { type: string, enum: [PENDING, SUCCEEDED, FAILED] }
                amount_minor: { type: integer }
                currency: { type: string }
                transaction_id: { type: string }
                failure_reason: { type: string }
                simulate:
                  type: string
                  enum: [invalid_signature, amount_mismatch, unknown_status]
                  description: Mock-only hook for tests.
      responses:
        '200': { description: Callback accepted or already processed }
        '400': { description: Invalid signature or payload }
        '404': { description: Unknown payment reference }
