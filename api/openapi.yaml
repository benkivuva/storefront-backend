openapi: 3.1.0
info:
  title: Storefront Backend API
  version: 1.0.0
  description: The REST API for the Storefront.
servers:
  - url: http://localhost:8080
    description: Local Development
  - url: https://api.storefront.co.ke
    description: Production

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, example: "about:blank" }
        title: { type: string, example: "invalid credentials" }
        status: { type: integer, example: 401 }
        code: { type: string, example: "INVALID_CREDENTIALS" }
      required: [type, title, status, code]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [customer, admin] }
        phone: { type: string }
        is_email_verified: { type: boolean }
        created_at: { type: string, format: date-time }
      required: [id, email, role, is_email_verified, created_at]

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        description: { type: string }
        category_id: { type: string, format: uuid }
        price_minor: { type: integer }
        currency: { type: string, example: KES }
        tax_class: { type: string, enum: [STANDARD_16, ZERO_RATED, EXEMPT] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
      required: [id, sku, name, price_minor, currency, tax_class, version, created_at]

    ProductsResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
      required: [products]

    RegisterRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string }
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        access_token: { type: string }
        user: { $ref: '#/components/schemas/User' }
      required: [access_token, user]

paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: Invalid input
        '409':
          description: Email taken

  /api/v1/auth/login:
    post:
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Invalid credentials

  /api/v1/me:
    get:
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: Unauthorized

  /api/v1/products:
    get:
      summary: List products
      parameters:
        - in: query
          name: limit
          schema: { type: integer, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Products retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductsResponse' }

  /api/v1/products/{id}:
    get:
      summary: Get product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Product retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: Product not found
