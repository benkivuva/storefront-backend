name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Adds a "Run workflow" button in the GitHub UI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AR_REPO: us-central1-docker.pkg.dev/retail-data-platform-511008/dev-retail-platform
  IMAGE_NAME: storefront-backend
  GITOPS_REPO: retail-platform-gitops
  GITOPS_MANIFEST: apps/storefront-backend/deployment.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.2.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -cover ./...
      
      - uses: golangci/golangci-lint-action@1481404843c368bc19ca9406f87d6e0fc97bdcfd # v7.0.0
        with:
          version: v2.15.0
          
      - name: Install and run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Docker build (no push)
        run: docker build -t "${IMAGE_NAME}:test" .

  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    # Only run when triggered manually from the GitHub Actions UI
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: storefront
          POSTGRES_PASSWORD: storefront
          POSTGRES_DB: storefront
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.2.0
        with:
          go-version-file: go.mod
      
      - name: Migrations
        env:
          MIGRATION_DATABASE_URL: postgres://storefront:storefront@localhost:5432/storefront?sslmode=disable
        run: go run ./cmd/migrate up
      
      - name: Seed catalog
        env:
          DATABASE_URL: postgres://storefront:storefront@localhost:5432/storefront?sslmode=disable
        run: go run ./cmd/seed -file testdata/catalog.csv
      
      - name: Start API
        env:
          DATABASE_URL: postgres://storefront:storefront@localhost:5432/storefront?sslmode=disable
          REDIS_CACHE_URL: redis://localhost:6379/0
          REDIS_STREAMS_URL: redis://localhost:6379/1
          RATE_LIMIT_GLOBAL_CAPACITY: "100000"
          RATE_LIMIT_AUTH_CAPACITY: "100000"
        run: |
          go build -o /tmp/api ./cmd/api
          /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:9090/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:9090/readyz || (cat /tmp/api.log && exit 1)
      
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
      
      - name: Load test (900 RPS, p99 < 50ms)
        run: k6 run test/load/catalog.js
      
      - name: API logs on failure
        if: failure()
        run: cat /tmp/api.log

  build-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Compute image tag
        run: echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA }}
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build image
        run: |
          docker build \
            -t "${AR_REPO}/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${AR_REPO}/${IMAGE_NAME}:main-latest" \
            .

      - name: Scan for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          image-ref: "${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push image
        run: |
          docker push "${AR_REPO}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${AR_REPO}/${IMAGE_NAME}:main-latest"

      - name: Update GitOps repo
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GITOPS_PAT:-}" ]; then
            echo "::error::GITOPS_PAT secret is not set"
            exit 1
          fi
          WORKDIR=$(mktemp -d)
          git clone --depth 1 \
            "https://x-access-token:${GITOPS_PAT}@github.com/benkivuva/${GITOPS_REPO}.git" \
            "$WORKDIR"
          cd "$WORKDIR"
          if [ ! -f "${GITOPS_MANIFEST}" ]; then
            echo "::error::${GITOPS_MANIFEST} not found in gitops repo"
            exit 1
          fi
          sed -i -E "s|(image: [^ ]*/${IMAGE_NAME}):[^ ]+|\1:${IMAGE_TAG}|" "${GITOPS_MANIFEST}"
          if ! grep -qE "image: [^ ]*/${IMAGE_NAME}:${IMAGE_TAG}$" "${GITOPS_MANIFEST}"; then
            echo "::error::sed pattern did not match in ${GITOPS_MANIFEST}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${GITOPS_MANIFEST}"
          if git diff --cached --quiet; then
            echo "No change to ${GITOPS_MANIFEST}; already at ${IMAGE_TAG}."
            exit 0
          fi
          git commit -m "chore(${IMAGE_NAME}): bump image to ${IMAGE_TAG}"
          git pull --rebase origin main
          git push
          