name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel if it's a PR. We don't cancel deploys to main halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AR_REPO: us-central1-docker.pkg.dev/retail-data-platform-511008/dev-retail-platform
  IMAGE_NAME: storefront-backend
  GITOPS_REPO: retail-platform-gitops
  GITOPS_MANIFEST: apps/storefront-backend/deployment.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12f16386c4b598e285f0e7763e73b648484be3 # v5.2.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -cover ./...
      
      - uses: golangci/golangci-lint-action@222badb8a23b98c2df02644fca8c9eb883f05074 # v7.0.0
        with:
          version: v2.15.0
          
      - name: Install and run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      # Prove the Dockerfile builds on PRs (no push, no cloud auth).
      - name: Docker build (no push)
        run: docker build -t "${IMAGE_NAME}:test" .

  build-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute image tag
        run: echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@251b1e889e227fe6e2a59e7f6dcf8d7f0c9c28b9 # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA }}
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build image
        run: |
          docker build \
            -t "${AR_REPO}/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${AR_REPO}/${IMAGE_NAME}:main-latest" \
            .

      - name: Scan for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@18f1b28b91723f9ea81bb61055034e80f96eb999 # v0.30.0
        with:
          image-ref: "${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push image
        run: |
          docker push "${AR_REPO}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${AR_REPO}/${IMAGE_NAME}:main-latest"

      - name: Update GitOps repo
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GITOPS_PAT:-}" ]; then
            echo "::error::GITOPS_PAT secret is not set"
            exit 1
          fi
          WORKDIR=$(mktemp -d)
          git clone --depth 1 \
            "https://x-access-token:${GITOPS_PAT}@github.com/benkivuva/${GITOPS_REPO}.git" \
            "$WORKDIR"
          cd "$WORKDIR"
          if [ ! -f "${GITOPS_MANIFEST}" ]; then
            echo "::error::${GITOPS_MANIFEST} not found in gitops repo"
            exit 1
          fi
          sed -i -E "s|(image: [^ ]*/${IMAGE_NAME}):[^ ]+|\1:${IMAGE_TAG}|" "${GITOPS_MANIFEST}"
          if ! grep -qE "image: [^ ]*/${IMAGE_NAME}:${IMAGE_TAG}$" "${GITOPS_MANIFEST}"; then
            echo "::error::sed pattern did not match in ${GITOPS_MANIFEST}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${GITOPS_MANIFEST}"
          if git diff --cached --quiet; then
            echo "No change to ${GITOPS_MANIFEST}; already at ${IMAGE_TAG}."
            exit 0
          fi
          git commit -m "chore(${IMAGE_NAME}): bump image to ${IMAGE_TAG}"
          git pull --rebase origin main
          git push
